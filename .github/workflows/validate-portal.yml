name: Validate Portal
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration syntax and browser JS
        run: |
          bash -n scripts/migrate-ecs.sh
          bash -n scripts/deploy-portal-ecs.sh
          bash -n scripts/install-ecs-ci.sh
          python3 -m py_compile scripts/prepare_release.py scripts/ci_gate.py
          node --check app.js
          node --check config.js
      - name: Check site files and referenced artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          assert 'id="rift-enter"' in html
          assert 'id="tactics-enter"' in html
          config = Path('config.js').read_text()
          assert '/games/rift/' in config
          assert '/games/tactics/' in config
          assert '原型已开放' in html
          assert '02 <span>/ 02</span>' in html
          assert 'Wildfield Tactics' in html
          assert 'v0.1.19.5' in html and 'v0.1.5' in html
          assert '16 种武器数据' in html
          assert '03 / GROWTH · 部分实现' in html
          assert '尚未开放' in html
          assert '@media(max-width:750px)' in css
          for path in ('assets/favicon.svg','assets/rift-art.svg','assets/tactics-art.svg'):
              text=Path(path).read_text()
              assert '<svg' in text and '</svg>' in text
              assert './'+path in html
          assert 'migrate-ecs.sh' in Path('docs/DEPLOY.md').read_text()
          PY
      - name: Test release preparation and CI gating
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          grep -q 'OnUnitInactiveSec=3min' ops/systemd/game-portal-deploy.timer
          grep -q 'ExecStart=/opt/game-portal/bin/deploy.sh' ops/systemd/game-portal-deploy.service
      - name: Static HTTP smoke check
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/game-portal-http.log 2>&1 &
          python3 - <<'PY'
          from urllib.request import urlopen
          import time
          for i in range(15):
              try:
                  with urlopen("http://127.0.0.1:8765/") as response:
                      data=response.read().decode()
                  assert 'id="rift-enter"' in data
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit("Portal did not start")
          for path in ('styles.css','app.js','config.js','assets/rift-art.svg','assets/tactics-art.svg'):
              with urlopen('http://127.0.0.1:8765/'+path) as response:
                  assert response.status == 200
          PY
