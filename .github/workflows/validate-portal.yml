name: Validate Portal
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration syntax and browser JS
        run: |
          bash -n scripts/migrate-ecs.sh
          bash -n scripts/deploy-portal-ecs.sh
          bash -n scripts/install-ecs-ci.sh
          bash -n scripts/provision-managed-ssh-ecs.sh
          bash -n scripts/managed-git-transport.sh
          bash -n scripts/install-managed-static-ecs.sh
          bash -n scripts/deploy-managed-static-ecs.sh
          python3 -m py_compile scripts/scaffold-static-site.py scripts/managed-ci-gate.py
          python3 -m py_compile scripts/prepare_release.py scripts/ci_gate.py
          node --check app.js
          node --check config.js
      - name: Check site files and referenced artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          assert 'id="rift-enter"' in html
          assert 'id="tactics-enter"' in html
          assert 'id="pinball-enter" href="/games/pinball/"' in html
          assert '<h2>星运弹珠局</h2>' in html
          assert 'id="love-enter" href="/love/"' in html
          config = Path('config.js').read_text()
          assert '/games/rift/' in config
          assert '/games/tactics/' in config
          assert '/games/pinball/' in config
          assert html.count('class="game-card ') == 3
          assert '<h1>选择游戏' in html
          assert '异界共振' in html
          assert 'Wildfield Tactics' in html
          assert 'id="rift-enter" href="/games/rift/"' in html
          assert 'id="tactics-enter" href="/games/tactics/"' in html
          assert 'id="pinball-enter" href="/games/pinball/"' in html
          for removed in ('tactics-section','milestones','bottom-callout','hero-compass','03 / GROWTH','页面进度同步','返回顶部'):
              assert removed not in html, removed
          assert '@media (max-width: 820px)' in css
          assert '@media (max-width: 420px)' in css
          assert 'prefers-reduced-motion' in css

          for path in ('assets/favicon.svg','assets/rift-art.svg','assets/tactics-art.svg','assets/pinball-art.svg'):
              text=Path(path).read_text()
              assert '<svg' in text and '</svg>' in text
              if path == 'assets/pinball-art.svg':
                  assert '/portal-assets/pinball-art.svg' in html
              else:
                  assert './'+path in html
          assert 'migrate-ecs.sh' in Path('docs/DEPLOY.md').read_text()
          PY
      - name: Test release preparation and CI gating
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          grep -q 'OnUnitInactiveSec=3min' ops/systemd/game-portal-deploy.timer
          grep -q 'ExecStart=/opt/game-portal/bin/deploy.sh' ops/systemd/game-portal-deploy.service
      - name: Static HTTP smoke check
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/game-portal-http.log 2>&1 &
          python3 - <<'PY'
          from urllib.request import urlopen
          import time
          for i in range(15):
              try:
                  with urlopen("http://127.0.0.1:8765/") as response:
                      data=response.read().decode()
                  assert 'id="rift-enter"' in data
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit("Portal did not start")
          for path in ('styles.css','app.js','config.js','assets/rift-art.svg','assets/tactics-art.svg','assets/pinball-art.svg'):
              with urlopen('http://127.0.0.1:8765/'+path) as response:
                  assert response.status == 200
          PY
