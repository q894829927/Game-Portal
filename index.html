<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#090e16" />
  <meta name="description" content="Game Portal 游戏大厅：进入《异界共振》或 Wildfield Tactics。" />
  <title>游戏大厅 · World / Select</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar container">
      <a class="brand" href="/" aria-label="游戏大厅首页">
        <span class="brand-symbol" aria-hidden="true">✧</span>
        <span>WORLD <span class="brand-separator">/</span> SELECT</span>
      </a>
      <span class="topbar-label">独立游戏</span>
    </header>

    <main class="main container">
      <div class="page-heading">
        <p class="eyebrow">GAME PORTAL</p>
        <h1>选择游戏<span class="heading-mark">.</span></h1>
      </div>

      <section class="game-grid" aria-label="可体验的游戏">
        <a class="game-card game-card--rift" id="rift-enter" href="/games/rift/" aria-label="进入异界共振">
          <img src="./assets/rift-art.svg" alt="" loading="eager" />
          <div class="card-shade" aria-hidden="true"></div>
          <div class="card-top">
            <span class="card-index">01</span>
            <span class="card-type">多人 · Roguelike</span>
          </div>
          <div class="card-bottom">
            <div class="card-name">
              <h2>异界共振</h2>
              <p>合作生存</p>
            </div>
            <span class="card-arrow" aria-hidden="true">↗</span>
          </div>
        </a>

        <a class="game-card game-card--tactics" id="tactics-enter" href="/games/tactics/" aria-label="进入 Wildfield Tactics 战棋原型">
          <img src="./assets/tactics-art.svg" alt="" loading="eager" />
          <div class="card-shade" aria-hidden="true"></div>
          <div class="card-top">
            <span class="card-index">02</span>
            <span class="card-type">单机 · 回合制</span>
          </div>
          <div class="card-bottom">
            <div class="card-name">
              <h2>Wildfield Tactics</h2>
              <p>策略战棋</p>
            </div>
            <span class="card-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
